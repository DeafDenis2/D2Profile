<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="profile">
        <div class="avatar">
            <img src="img/666.png" alt="Avatar">
        </div>
        <h1 class="name">DeafDenis2</h1>
        <p class="bio">Добро пожаловать в мой профиль</p>

        <div class="links">
            <a class="button steam" id="steam-btn" href="https://steamcommunity.com/id/DeafDenis2Official/" target="_blank" rel="noopener">
                <i class="fa-brands fa-steam icon"></i> Steam
            </a>
            <a class="button telegram" href="https://t.me/DeafDenis2Official" target="_blank" rel="noopener">
                <i class="fa-brands fa-telegram icon"></i> Telegram Канал D2Official
            </a>
            <a class="button donation" href="https://www.donationalerts.com/r/deafdenis2_twitch" target="_blank" rel="noopener">
                <i class="fa-solid fa-circle-dollar-to-slot icon"></i> Поддержка Донат
            </a>
        </div>
    </main>

    <section class="twitch-support">
        <h2 class="center-title">TWITCH DEAF</h2>
        <h3 class="section-title"><i class="fa-brands fa-twitch icon"></i> DEAF — Поддержка TWITCH</h3>
        <ul class="streamers">
            <li><a href="https://www.twitch.tv/tasmadan" target="_blank" rel="noopener"><img class="stream-avatar" data-name="tasmadan" alt=""><span class="stream-status" data-name="tasmadan"></span>Tasmadan</a></li>
            <li><a href="https://www.twitch.tv/lediya112" target="_blank" rel="noopener"><img class="stream-avatar" data-name="lediya112" alt=""><span class="stream-status" data-name="lediya112"></span>LeDiya112</a></li>
            <li><a href="https://www.twitch.tv/kingbumixa" target="_blank" rel="noopener"><img class="stream-avatar" data-name="kingbumixa" alt=""><span class="stream-status" data-name="kingbumixa"></span>KingBumixa</a></li>
            <li><a href="https://www.twitch.tv/sm1lezombie" target="_blank" rel="noopener"><img class="stream-avatar" data-name="sm1lezombie" alt=""><span class="stream-status" data-name="sm1lezombie"></span>Sm1lezombie</a></li>
            <li><a href="https://www.twitch.tv/prokop1000" target="_blank" rel="noopener"><img class="stream-avatar" data-name="prokop1000" alt=""><span class="stream-status" data-name="prokop1000"></span>prokop1000</a></li>
            <li><a href="https://www.twitch.tv/rlvan" target="_blank" rel="noopener"><img class="stream-avatar" data-name="rlvan" alt=""><span class="stream-status" data-name="rlvan"></span>Rlvan</a></li>
            <li><a href="https://www.twitch.tv/baksash" target="_blank" rel="noopener"><img class="stream-avatar" data-name="baksash" alt=""><span class="stream-status" data-name="baksash"></span>BakSash</a></li>
        </ul>
        <p class="soon">Soon...</p>
        <div class="status-loading" id="status-loading">
            <span class="loader"></span>
            Загрузка статуса...
        </div>
    </section>

    <script>
        var statusEls = document.querySelectorAll(".stream-status");
        var loading = document.getElementById("status-loading");
        var done = 0;

        statusEls.forEach(function (el) {
            fetch("https://api.ivr.fi/v2/twitch/user?login=" + el.dataset.name)
                .then(function (r) {
                    return r.json();
                })
                .then(function (data) {
                    var user = data[0];
                    var avatar = document.querySelector('.stream-avatar[data-name="' + el.dataset.name + '"]');
                    if (user && user.logo && avatar) {
                        avatar.src = user.logo;
                    }
                    if (user && user.stream) {
                        el.classList.add("online");
                    } else {
                        el.classList.add("offline");
                    }
                })
                .catch(function () {
                    el.classList.add("offline");
                })
                .then(function () {
                    done++;
                    if (done >= statusEls.length) {
                        loading.style.display = "none";
                    }
                });
        });

        function checkDone() {
            done++;
            if (done >= statusEls.length) {
                loading.style.display = "none";
            }
        }
    </script>

    <script>
        document.getElementById("steam-btn").addEventListener("click", function (e) {
            e.preventDefault();
            var profile = "https://steamcommunity.com/id/DeafDenis2Official/";
            var started = Date.now();
            window.location.href = "steam://openurl/" + profile;
            setTimeout(function () {
                if (Date.now() - started < 1500 && document.hasFocus()) {
                    window.location.href = profile;
                }
            }, 1200);
        });
    </script>
</body>
</html>
